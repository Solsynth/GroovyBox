name: music_kit
description: A Flutter plugin to access and play Apple Music (vendored, darwin only).
version: 1.3.0
publish_to: none
homepage: https://github.com/misiio/flutter_music_kit/tree/master/packages/music_kit

environment:
  sdk: ^3.7.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  music_kit_platform_interface:
    path: ../music_kit_platform_interface

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: MusicKitPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: MusicKitPlugin
        sharedDarwinSource: true
