name: groovy_box
description: "The LittleSheep's music player"
publish_to: 'none'

version: 2.0.0+20

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  easy_localization: ^3.0.8
  flutter_localizations:
    sdk: flutter

  # Design system + routing + state
  material_ui: ^1.11.0
  material_color_utilities: ^0.13.0
  material_symbols_icons: ^4.2960.0
  auto_route: ^11.2.0
  hooks_riverpod: ^3.5.0
  flutter_hooks: ^0.21.4

  # Desktop window
  window_manager: ^0.6.0
  shared_preferences: ^2.5.6

  # Library + playback
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  clock: ^1.1.3
  riverpod_annotation: ^4.0.8
  dio: ^5.11.1
  crypto: ^3.0.8
  cupertino_ui: ^1.1.6
  liquid_glass_renderer: ^1.0.0-dev.2
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  path_provider: ^2.1.6
  path: ^1.9.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  romanize: ^0.0.3
  kana_kit: ^2.1.1
  kuromoji: ^1.0.5
  permission_handler: ^13.0.2
  file_picker: ^13.3.3
  share_plus: ^13.3.1
  flutter_web_auth_2: ^5.1.0
  url_launcher: ^6.3.3
  audio_metadata_reader: ^1.8.1
  # Vendored (packages/music_kit) so the darwin player exposes seek, guards
  # macOS 12/13 where ApplicationMusicPlayer does not exist, and the iOS/macOS
  # pods share one source tree.
  music_kit:
    path: packages/music_kit
  skeletonizer: ^3.0.0
  marqueer: ^2.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the scrobbler's timers without waiting wall-clock minutes.
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  # Fakes the app-support directory in the import test, which must write into
  # a real directory without a platform channel.
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  build_runner: ^2.16.1
  auto_route_generator: ^10.6.0
  riverpod_generator: ^4.0.10
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.35.3

flutter:
  uses-material-design: true

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Italic.ttf
          style: italic

  assets:
    - assets/i18n/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.jpg"
  min_sdk_android: 21
  image_path_ios_dark_transparent: "assets/images/icon-dark.png"
  remove_alpha_ios: true
  desaturate_tinted_to_grayscale_ios: true
  background_color_ios: "#ffffff"
  web:
    generate: true
    image_path: "assets/images/icon-rounded.png"
    background_color: "#ffffff"
    theme_color: "#2eb0c7"
  windows:
    generate: true
    image_path: "assets/images/icon-rounded.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/icon-padded.png"
