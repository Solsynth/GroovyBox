name: groovy_box
description: "The LittleSheep's music player"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Design system + routing + state
  material_ui: ^1.8.0
  material_color_utilities: ^0.13.0
  material_symbols_icons: ^4.2960.0
  auto_route: ^11.2.0
  hooks_riverpod: ^3.4.3
  flutter_hooks: ^0.21.3+1

  # Desktop window
  window_manager: ^0.5.2
  shared_preferences: ^2.5.6

  # Library + playback
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  riverpod_annotation: ^4.0.7
  dio: ^5.11.1
  crypto: ^3.0.7
  cupertino_ui: ^1.1.4
  liquid_glass_renderer: ^1.0.0-dev.1
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.3.7+1
  path_provider: ^2.1.6
  path: ^1.9.1
  sqlite3: ^2.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  auto_route_generator: ^10.6.0
  riverpod_generator: ^4.0.9
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Italic.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.jpg"
  min_sdk_android: 21
  image_path_ios_dark_transparent: "assets/images/icon-dark.png"
  remove_alpha_ios: true
  desaturate_tinted_to_grayscale_ios: true
  background_color_ios: "#ffffff"
  web:
    generate: true
    image_path: "assets/images/icon-rounded.png"
    background_color: "#ffffff"
    theme_color: "#2eb0c7"
  windows:
    generate: true
    image_path: "assets/images/icon-rounded.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/icon-padded.png"
